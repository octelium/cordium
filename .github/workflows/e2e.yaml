name: tests-e2e
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "The e2e scenario to run against"
        required: false
        default: "k3s-flannel-cordium"
      run:
        description: "Only run tests matching this regular expression (go test -run)"
        required: false
        default: ""
      suite:
        description: "Which phases to run"
        required: false
        type: choice
        options:
          - cordium
          - all
        default: cordium
      packageVersion:
        description: "cordium package version to install. Defaults to this branch"
        required: false
        default: ""
      coreVersion:
        description: "Octelium core version to install. Empty means latest"
        required: false
        default: ""
env:
  GO_VERSION: "1.26.8"
  OCTELIUM_E2E_SUITE: ${{ inputs.suite || 'cordium' }}
  OCTELIUM_E2E_PACKAGE_VERSION: ${{ inputs.packageVersion }}
  OCTELIUM_E2E_CORE_VERSION: ${{ inputs.coreVersion }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            scenario: k3s-flannel-cordium
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.scenario }}-${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h /

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Build
        run: |
          go version
          make build-e2e
          make build-cli
          sudo install -m 0755 bin/cordium /usr/local/bin/cordium
          make install-cli

      - name: Provision
        run: ./bin/cordium-e2e provision --scenario=${{ inputs.scenario || matrix.scenario }}

      - name: Prepare
        run: ./bin/cordium-e2e prepare --scenario=${{ inputs.scenario || matrix.scenario }}

      - name: Install
        run: ./bin/cordium-e2e install --scenario=${{ inputs.scenario || matrix.scenario }}

      - name: Test
        run: |
          ./bin/cordium-e2e test \
            --scenario=${{ inputs.scenario || matrix.scenario }} \
            --artifacts="${{ runner.temp }}/e2e-artifacts" \
            --timeout=170m \
            ${{ inputs.run && format('--run={0}', inputs.run) || '' }}

      - name: Collect cluster state on failure
        if: failure()
        run: |
          OUT="${{ runner.temp }}/e2e-artifacts"
          mkdir -p "$OUT"

          kubectl get all -A -o wide > "$OUT/get-all.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$OUT/events.txt" 2>&1 || true
          kubectl describe nodes > "$OUT/describe-nodes.txt" 2>&1 || true
          { df -h /; echo; free -h; } > "$OUT/host-resources.txt" 2>&1 || true
          kubectl describe pods -n octelium > "$OUT/describe-pods.txt" 2>&1 || true
          kubectl describe pods -n cordium > "$OUT/describe-pods-cordium.txt" 2>&1 || true
          kubectl get pvc -A -o wide > "$OUT/pvc.txt" 2>&1 || true
          kubectl describe pvc -n cordium > "$OUT/describe-pvc-cordium.txt" 2>&1 || true
          kubectl get storageclass -o wide > "$OUT/storageclass.txt" 2>&1 || true
          kubectl get nodes --show-labels > "$OUT/nodes.txt" 2>&1 || true
          kubectl get jobs -n octelium -o wide > "$OUT/jobs.txt" 2>&1 || true

          for ns in octelium cordium; do
            for pod in $(kubectl get pods -n "$ns" -o name 2>/dev/null); do
              name=$(basename "$pod")
              kubectl logs "$pod" -n "$ns" --all-containers --tail=200 \
                > "$OUT/logs-${ns}-${name}.txt" 2>&1 || true
              kubectl logs "$pod" -n "$ns" --all-containers --tail=200 --previous \
                > "$OUT/logs-${ns}-${name}-previous.txt" 2>&1 || true
            done
          done
          find "$OUT" -name 'logs-*-previous.txt' -size -1c -delete || true

          cp /tmp/octelium-e2e-k3s.log "$OUT/" 2>/dev/null || true
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.scenario }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
